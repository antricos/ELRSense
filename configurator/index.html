<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ELRSense Configurator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --surface: #ffffff;
        --surface-2: #f0f1f4;
        --border: #e0e2e8;
        --text: #1a1d23;
        --text-muted: #6b7280;
        --accent: #3457e8;
        --accent-contrast: #ffffff;
        --danger: #c0392b;
        --danger-bg: rgba(192, 57, 43, 0.08);
        --radius: 12px;
        --radius-sm: 8px;
        --shadow: 0 1px 2px rgba(16, 20, 30, 0.04), 0 6px 16px rgba(16, 20, 30, 0.05);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #101217;
            --surface: #171a21;
            --surface-2: #1e222b;
            --border: #2b2f3a;
            --text: #e7e9ee;
            --text-muted: #97a0ad;
            --accent: #6f8dff;
            --accent-contrast: #0b1020;
            --danger: #f28b7d;
            --danger-bg: rgba(242, 139, 125, 0.12);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.3);
        }
    }
    * { box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        max-width: 780px;
        margin: 0 auto;
        padding: 2.75rem 1.25rem 4rem;
        line-height: 1.55;
    }

    .app-header { margin-bottom: 1.75rem; }
    h1 {
        font-size: 1.55rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex-wrap: wrap;
    }
    .board-badge {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.25rem 0.65rem;
    }
    .subtitle { margin: 0; color: var(--text-muted); font-size: 0.95rem; max-width: 62ch; }

    .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 1.25rem 1.35rem;
        margin-bottom: 1.25rem;
    }
    .panel-title {
        display: block;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 0.75rem;
    }

    select, input[type="number"] {
        font-size: 0.95rem;
        font-family: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.45rem 0.6rem;
    }
    select:focus, input[type="number"]:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    #baud-select { width: 100%; max-width: 420px; }

    #reserved-pins-box {
        display: inline-block;
        font-size: 0.82rem;
        color: var(--text-muted);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.45rem 0.7rem;
    }
    #pinout-details { margin-top: 0.85rem; }
    #pinout-details summary {
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--accent);
        width: fit-content;
    }
    #pinout-details img {
        max-width: 100%;
        margin-top: 0.75rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow);
    }

    .sensor-name { flex: 1; font-weight: 600; font-size: 0.95rem; }
    .sensor-frame {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.72rem;
        color: var(--text-muted);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.15rem 0.55rem;
        white-space: nowrap;
    }
    .sensor-pin-note { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.4rem; }

    .sensor-group {
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.85rem 1rem;
        margin-bottom: 0.65rem;
    }
    .sensor-group:last-child { margin-bottom: 0; }
    .sensor-group-header { display: flex; align-items: center; gap: 0.65rem; }

    .add-instance-btn {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--accent-contrast);
        background: var(--accent);
        border: none;
        border-radius: 999px;
        padding: 0.32rem 0.85rem;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.1s ease;
    }
    .add-instance-btn:hover:not(:disabled) { opacity: 0.88; }
    .add-instance-btn:active:not(:disabled) { transform: scale(0.96); }
    .add-instance-btn:disabled {
        cursor: not-allowed;
        color: var(--text-muted);
        background: var(--border);
        opacity: 0.7;
    }

    .instance-list { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .instance-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.55rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.45rem 0.6rem;
    }
    .instance-label { min-width: 1.6rem; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
    .instance-row select { font-size: 0.85rem; padding: 0.3rem 0.5rem; }

    .config-field-label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-muted);
    }
    .config-field-input { width: 5.5rem; font-size: 0.85rem; padding: 0.28rem 0.45rem; }

    .remove-instance-btn {
        margin-left: auto;
        font-size: 0.78rem;
        color: var(--danger);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.25rem 0.6rem;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
    }
    .remove-instance-btn:hover { background: var(--danger-bg); border-color: var(--danger); }

    #conflict-box {
        margin-top: 0.85rem;
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--danger);
        background: var(--danger-bg);
        border-radius: var(--radius-sm);
        color: var(--danger);
        font-size: 0.88rem;
    }

    #generate-btn {
        font-size: 1rem;
        font-weight: 700;
        color: var(--accent-contrast);
        background: var(--accent);
        border: none;
        border-radius: var(--radius-sm);
        padding: 0.75rem 1.5rem;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition: transform 0.12s ease, opacity 0.12s ease;
    }
    #generate-btn:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.95; }
    #generate-btn:active:not(:disabled) { transform: translateY(0); }
    #generate-btn:disabled {
        cursor: not-allowed;
        color: var(--text-muted);
        background: var(--surface-2);
        box-shadow: none;
    }
    #status-box { margin-top: 0.75rem; font-size: 0.88rem; color: var(--text-muted); }
</style>
</head>
<body>

<div class="app-header">
    <h1>ELRSense Configurator <span class="board-badge">ESP32-C3 Zero</span></h1>
    <p class="subtitle">Add the sensors you're using -- mapping each to a pin where applicable; download a single, self-contained .ino ready to open in Arduino IDE and flash.</p>
</div>

<section class="panel">
    <div id="reserved-pins-box"></div>
    <details id="pinout-details">
        <summary>View ESP32-C3 Zero pinout diagram</summary>
        <img src="../recources/esp32-c3-zero-pinout.jpg" alt="ESP32-C3 Zero pinout diagram" loading="lazy">
    </details>
</section>

<section class="panel">
    <label class="panel-title" for="baud-select">CRSF baud rate</label>
    <select id="baud-select"></select>
</section>

<section class="panel">
    <label class="panel-title">Sensors</label>
    <div id="sensor-list"></div>
    <div id="conflict-box" hidden></div>
</section>

<section class="panel">
    <button id="generate-btn">Generate &amp; download .ino</button>
    <div id="status-box"></div>
</section>

<script src="catalog.js"></script>
<script src="generator.js"></script>
<script src="app.js"></script>
</body>
</html>
